services:
  easysave-cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: easysave-cli:local
    container_name: easysave-cli
    stdin_open: true
    tty: true
    volumes:
      - ./docker-data/config:/app/config
      - ./docker-data/logs:/app/logs
      - ./docker-data/state:/app/state
      - ./docker-data/source:/workspace/source
      - ./docker-data/target:/workspace/target

  easysave-logs:
    image: easysave-cli:local
    container_name: easysave-logs
    entrypoint: ["sh", "-c", "while true; do sleep 3600; done"]
    volumes:
      - ./publish/logs:/app/logs:ro
